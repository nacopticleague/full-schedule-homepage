<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 NA Coptic League</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-y: auto; }
body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 0; color: #1a1a1a; }

/* ── Sections ── */
.section { max-width: 660px; margin: 0 auto; padding: 22px 18px; }
.section-title { font-family: Arial, sans-serif; font-weight: 700; font-size: 1.15rem; color: #7d1a1a; text-align: center; margin-bottom: 14px; }
.section p { font-size: 0.95rem; color: #1a1a1a; line-height: 1.6; max-width: 600px; margin: 0 auto 12px; }
.section a { color: #2d3a8c; font-weight: 600; text-decoration: underline; }
.section a:hover { color: #1a2670; }
.section strong { color: #1a1a1a; font-weight: 800; }

/* ── Filters ── */
.filters { background: #fff; padding: 16px; }
.filter-row { display: flex; gap: 12px; flex-wrap: wrap; max-width: 660px; margin: 0 auto; }
.fg { flex: 1; min-width: 140px; }
.fg label { display: block; font-family: Arial, sans-serif; font-size: 0.72rem; font-weight: 700; color: #5c1010; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 6px; text-align: center; font-style: italic; }
.fg select { width: 100%; padding: 10px 12px; border: 2px solid #b8901c; border-radius: 4px; font-family: Arial, sans-serif; font-size: 0.9rem; font-weight: 600; color: #5c1010; background: #fff; cursor: pointer; }
.fg select:focus { outline: 2px solid #d4a73a; border-color: #d4a73a; }

/* ── Main ── */
.main { width: 100%; background: #fff; }
.main #out { max-width: 660px; margin: 0 auto; padding: 22px 14px; }

/* ── Empty ── */
.empty { background: #fff; border-radius: 8px; text-align: center; padding: 44px 20px; box-shadow: 0 2px 10px rgba(80,20,20,.08); }
.empty .icon { font-size: 2.4rem; margin-bottom: 10px; }
.empty h3 { font-family: Arial, sans-serif; font-style: italic; color: #7d1a1a; font-size: 1.05rem; margin-bottom: 8px; font-weight: 700; }
.empty p { font-size: 0.92rem; color: #555; line-height: 1.6; }

/* ── Stats bar ── */
.statsbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 7px; background: #7d1a1a; color: #d4a73a; padding: 6px 14px 6px 10px; border-radius: 22px; font-family: Arial, sans-serif; font-size: 0.85rem; font-weight: 700; box-shadow: 0 2px 6px rgba(125,26,26,.25); border: 1px solid #d4a73a; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #d4a73a; }
.cnt { font-size: 0.85rem; color: #5c1010; font-weight: 600; }
.cnt a { color: #2d3a8c; text-decoration: underline; }
.cnt a:hover { color: #1a2670; }

/* ── Day group ── */
.dg { margin-bottom: 22px; }
.dh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 6px 0; }
.dlabel { font-family: Arial, sans-serif; font-style: italic; font-size: 0.95rem; font-weight: 700; color: #5c1010; white-space: nowrap; }
.dcount { font-size: 0.7rem; font-weight: 700; color: #5c1010; background: #d4a73a; padding: 2px 9px; border-radius: 10px; white-space: nowrap; border: 1px solid #b8901c; }
.dline { display: none; }

/* ── Game card ── */
.card { background: #fff; border-radius: 6px; box-shadow: 0 2px 8px rgba(80,20,20,.08); padding: 10px 14px 10px 18px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; transition: box-shadow .15s; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #7d1a1a; }
.card:hover { box-shadow: 0 4px 12px rgba(80,20,20,.12); }
.tcol { text-align: center; min-width: 110px; flex-shrink: 0; }
.thour { font-family: Arial, sans-serif; font-size: 0.78rem; font-weight: 700; color: #7d1a1a; line-height: 1.3; }
.divdr { display: none; }
.mcol { flex: 1; min-width: 0; }
.teams { font-weight: 700; font-size: 0.92rem; color: #1a1a1a; line-height: 1.3; }
.teams .sep { color: #d4a73a; margin: 0 5px; font-weight: 700; font-size: 0.85rem; font-style: italic; }
.div-tag { display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 3px; background: #d4a73a; color: #5c1010; letter-spacing: .05em; text-transform: uppercase; margin-left: 6px; vertical-align: middle; }
.final { font-size: 0.7rem; color: #888; margin-top: 3px; font-style: italic; }
.venue-line { font-size: 0.78rem; color: #555; margin-top: 4px; font-weight: 600; }
.venue-line a { color: #2d3a8c; text-decoration: underline; font-weight: 600; }
.venue-line a:hover { color: #1a2670; }

/* ── Spinner ── */
.spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e8d8b8; border-top-color: #7d1a1a; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media(max-width:480px) {
  .filter-row { flex-direction: column; }
  .fg { min-width: 100%; }
  .card { flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 14px 12px 18px; }
  .tcol { text-align: left; min-width: unset; }
  .divdr { display: none; }
  .mcol { width: 100%; }
}
</style>
</head>
<body>

<div class="section">
  <div class="section-title">🏀 Regular Season</div>
</div>

<div class="filters">
  <div class="filter-row">
    <div class="fg">
      <label>Date</label>
      <select id="fdate" onchange="render()"></select>
    </div>
    <div class="fg">
      <label>Division</label>
      <select id="fdiv" onchange="render()">
        <option value="">All Divisions</option>
        <option value="JHS">Junior High School (JHS)</option>
        <option value="Girls">Girls</option>
        <option value="HS-NY">High School — NY</option>
        <option value="HS-NJ">High School — NJ</option>
        <option value="College">College</option>
        <option value="Mens">Mens</option>
      </select>
    </div>
    <div class="fg">
      <label>Venue</label>
      <select id="fvenue" onchange="render()">
        <option value="">All Venues</option>
        <option value="HC">Holy Child Catholic Church</option>
        <option value="BK">St. George Community Center</option>
        <option value="EB">St. Mark Coptic Christian Academy</option>
        <option value="LI">St. Mark Coptic Center LI</option>
        <option value="CYO">CYO MIV</option>
        <option value="SJN">St. John Neumann</option>
        <option value="GC">Kimisis Tis Theotokou Greek Orthodox Church</option>
        <option value="MSK1">Multi Sports Kingdom — Court #1</option>
        <option value="MSK2">Multi Sports Kingdom — Court #2</option>
      </select>
    </div>
  </div>
</div>

<div class="main"><div id="out">
  <div class="empty"><div class="spinner"></div><h3>Loading schedule…</h3><p>One moment.</p></div>
</div></div>

<script>
var VENUES = {
  HC: { name: "Holy Child Catholic Church", url: "https://maps.google.com/?q=4747+Amboy+Rd,+Staten+Island,+NY+10312" },
  BK: { name: "St. George Community Center", url: "https://maps.google.com/?q=6209+11th+Ave,+Brooklyn,+NY+11219" },
  EB: { name: "St. Mark Coptic Christian Academy", url: "https://maps.google.com/?q=80+David+St,+South+River,+NJ+08882" },
  LI: { name: "St. Mark Coptic Center LI", url: "https://maps.google.com/?q=90+Woodbury+Rd,+Woodbury,+NY+11797" },
  CYO: { name: "CYO MIV", url: "https://maps.google.com/?q=CYO+MIV" },
  SJN: { name: "St. John Neumann", url: "https://maps.google.com/?q=St+John+Neumann" },
  GC: { name: "Kimisis Tis Theotokou Greek Orthodox Church", url: "https://maps.google.com/?q=20+Hillcrest+Rd,+Holmdel,+NJ+07733" },
  MSK1: { name: "Multi Sports Kingdom — Court #1", url: "https://maps.google.com/?q=2+Timber+Ln,+Marlboro+Township,+NJ+07746" },
  MSK2: { name: "Multi Sports Kingdom — Court #2", url: "https://maps.google.com/?q=2+Timber+Ln,+Marlboro+Township,+NJ+07746" }
};

var DIV_LABELS = {"HS-NY":"HS · NY","HS-NJ":"HS · NJ","JHS":"JHS","Girls":"Girls","College":"College","Mens":"Mens"};

var GAMES = [];

function loadGames() {
  var url = 'data/games.json?_=' + Date.now();
  fetch(url)
    .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
    .then(function(data){
      GAMES = (Array.isArray(data) ? data : []).map(function(g){
        return {
          t1: g.t1 || '', t2: g.t2 || '', div: g.div || '', date: g.date || '', time: g.time || '', v: g.v || '',
          s1: (g.s1 === '' || g.s1 == null) ? null : g.s1,
          s2: (g.s2 === '' || g.s2 == null) ? null : g.s2
        };
      });
      buildDateFilter();
      render();
    })
    .catch(function(err){
      document.getElementById('out').innerHTML = '<div class="empty"><div class="icon">⚠️</div><h3>Could not load games</h3><p>'+err.message+'</p></div>';
    });
}

function stripParens(name) { return name.replace(/[()]/g, ''); }
function addHour(time) { var p=time.split(' '),hm=p[0].split(':'),h=parseInt(hm[0]),m=hm[1],ap=p[1],eh=h+1,eap=ap; if(h===11&&ap==='AM')eap='PM'; if(h===11&&ap==='PM')eap='AM'; if(eh>12)eh-=12; return p[0]+' '+ap+' – '+eh+':'+m+' '+eap; }
function timeSort(a,b){function to24(t){var p=t.split(' '),hm=p[0].split(':'),h=+hm[0],m=+hm[1];if(p[1]==='PM'&&h!==12)h+=12;if(p[1]==='AM'&&h===12)h=0;return h*60+m;}return to24(a.time)-to24(b.time);}
function fmtDateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function fmtDateLong(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}

function buildDateFilter() {
  var sel = document.getElementById('fdate'), dateSet = {};
  GAMES.forEach(function(g){ dateSet[g.date] = true; });
  var allDates = Object.keys(dateSet).sort(), today = new Date(); today.setHours(0,0,0,0);
  sel.innerHTML = '<option value="ALL">All Dates</option>';
  var closestIdx = 0, closestDiff = Infinity;
  allDates.forEach(function(d, idx){
    var o = document.createElement('option'); o.value = d; o.text = fmtDateLabel(d); sel.appendChild(o);
    var diff = new Date(d+'T12:00:00') - today;
    if (diff >= 0 && diff < closestDiff) { closestDiff = diff; closestIdx = idx + 1; }
  });
  if (closestDiff === Infinity && allDates.length) closestIdx = allDates.length;
  sel.selectedIndex = closestIdx;
}

function render() {
  var dateF=document.getElementById('fdate').value, divF=document.getElementById('fdiv').value, venF=document.getElementById('fvenue').value, out=document.getElementById('out');
  var filtered = GAMES.filter(function(g){
    if(dateF !== 'ALL' && g.date !== dateF) return false;
    if(divF && g.div !== divF) return false;
    if(venF && g.v !== venF) return false;
    return true;
  });
  if (!filtered.length) {
    var ev = VENUES[venF] ? VENUES[venF].name : '', ed = (dateF !== 'ALL') ? ' on ' + fmtDateLong(dateF) : '';
    out.innerHTML = '<div class="empty"><div class="icon">🏀</div><h3>' + (ev ? 'No games scheduled' + ed + ' at ' + ev : 'No games found') + '</h3><p>Try a different filter or check back later.</p></div>';
    return;
  }
  var byDate = {};
  filtered.forEach(function(g){ if(!byDate[g.date]) byDate[g.date] = []; byDate[g.date].push(g); });
  var dates = Object.keys(byDate).sort(), total = filtered.length, vn = VENUES[venF];
  var divLabel = divF ? (DIV_LABELS[divF] || divF) : 'All Divisions';
  var venueLink = vn ? '<a href="' + vn.url + '" target="_blank">' + vn.name + ' — directions</a>' : '';
  var h = '<div class="statsbar"><div class="badge"><div class="dot"></div>' + divLabel + '</div><div class="cnt">' + total + ' game' + (total !== 1 ? 's' : '') + (venueLink ? ' &middot; ' + venueLink : '') + '</div></div>';
  dates.forEach(function(date){
    var games = byDate[date].sort(timeSort), dl = fmtDateLong(date);
    h += '<div class="dg"><div class="dh"><span class="dlabel">' + dl + '</span><span class="dcount">' + games.length + ' game' + (games.length !== 1 ? 's' : '') + '</span><div class="dline"></div></div>';
    games.forEach(function(g){
      var tr = addHour(g.time), dtag = '<span class="div-tag">' + (DIV_LABELS[g.div] || g.div) + '</span>';
      var t1name = stripParens(g.t1), t2name = stripParens(g.t2);
      var finalHtml = '', t1display = t1name, t2display = t2name;
      if (g.s1 != null && g.s2 != null) {
        t1display = t1name + ' [' + g.s1 + ']';
        t2display = t2name + ' [' + g.s2 + ']';
        finalHtml = '<div class="final">Final Score</div>';
      }
      var venueHtml = '';
      if (!venF) {
        var vn = VENUES[g.v];
        venueHtml = vn ? '<div class="venue-line">📍 <a href="' + vn.url + '" target="_blank">' + vn.name + '</a></div>' : '';
      }
      h += '<div class="card"><div class="tcol"><div class="thour">' + tr + '</div></div><div class="divdr"></div><div class="mcol"><div class="teams">' + t1display + '<span class="sep">vs.</span>' + t2display + dtag + '</div>' + venueHtml + finalHtml + '</div></div>';
    });
    h += '</div>';
  });
  out.innerHTML = h;
}

loadGames();

function broadcastHeight() { window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*'); }
window.addEventListener('load', broadcastHeight);
new MutationObserver(broadcastHeight).observe(document.body, { childList: true, subtree: true });
setInterval(broadcastHeight, 500);
</script>
</body>
</html>
